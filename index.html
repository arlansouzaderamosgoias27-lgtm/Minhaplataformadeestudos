<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Estudos</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --font-family: Arial, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 0.5rem;
            margin-top: 0.5rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
        }

        .date-display {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: white;
        }

        .pendencia-item {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 0.75rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Plataforma de Estudos</h1>
        <div id="current-date" class="date-display"></div>
    </header>

    <div class="container">
        <!-- Seção de Início / Metas de Hoje -->
        <div class="card">
            <h2>Início de Estudos</h2>
            <div id="today-goals">
                <p><strong>Data Atual:</strong> <span id="goal-date"></span></p>
                <p><strong>Metas de Hoje e Pendências:</strong></p>
                
                <div id="lista-pendencias">
                    <div class="pendencia-item" id="pendencia-1">
                        <p><strong>Processo Penal - Tópico 00</strong> (Pendente de ontem)</p>
                        <button onclick="resolverPendencia('pendencia-1')">Resolver Pendência</button>
                        <button class="btn-secondary" onclick="dispensarPendencia('pendencia-1')">Dispensar</button>
                    </div>
                </div>

                <ul>
                    <li>Revisões automáticas agendadas</li>
                </ul>
            </div>
            <button onclick="iniciarEstudos()">Iniciar Estudos</button>
        </div>

        <!-- Seção de Perfil -->
        <div class="card">
            <h2>Meu Perfil</h2>
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" placeholder="Sua idade">
            </div>
            <div class="form-group">
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento">
            </div>
            <div class="form-group">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" placeholder="Sua cidade">
            </div>
            <div class="form-group">
                <label for="estado">Estado:</label>
                <input type="text" id="estado" placeholder="Seu estado">
            </div>
            <div class="form-group">
                <label for="objetivo">Objetivo do Concurso Atual:</label>
                <input type="text" id="objetivo" placeholder="Ex: Concurso Público X">
            </div>
            <button onclick="salvarPerfil()">Salvar Perfil</button>
        </div>

        <!-- Seção de Configurações -->
        <div class="card">
            <h2>Configurações e Personalização</h2>
            <div class="form-group">
                <label for="primary-color-picker">Cor Principal:</label>
                <input type="color" id="primary-color-picker" value="#007bff" onchange="mudarCor(this.value)">
            </div>
            <div class="form-group">
                <label for="font-family-picker">Tipo de Letra (Fonte):</label>
                <select id="font-family-picker" onchange="mudarFonte(this.value)">
                    <option value="Arial, sans-serif">Padrão (Arial)</option>
                    <option value="'Courier New', Courier, monospace">Cursiva / Monospace</option>
                    <option value="'Georgia', serif">Elegante (Georgia)</option>
                    <option value="'Times New Roman', serif">Formal (Times New Roman)</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        // Exibir data atual formatada e vinculada
        function atualizarData() {
            const dataAtual = new Date();
            const opcoes = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dataFormatada = dataAtual.toLocaleDateString('pt-BR', opcoes);
            
            document.getElementById('current-date').innerText = dataFormatada;
            document.getElementById('goal-date').innerText = dataFormatada;
        }

        function iniciarEstudos() {
            const dataAtual = new Date().toLocaleDateString('pt-BR');
            alert("Início de estudos acionado em: " + dataAtual);
        }

        function salvarPerfil() {
            alert("Perfil salvo com sucesso!");
        }

        function resolverPendencia(id) {
            const elemento = document.getElementById(id);
            if (elemento) {
                alert("Redirecionando para estudar o tópico atrasado e resolver a pendência!");
                elemento.remove();
            }
        }

        function dispensarPendencia(id) {
            const elemento = document.getElementById(id);
            if (elemento) {
                elemento.remove();
            }
        }

        function mudarCor(cor) {
            document.documentElement.style.setProperty('--primary-color', cor);
        }

        function mudarFonte(fonte) {
            document.documentElement.style.setProperty('--font-family', fonte);
        }

        // Executar ao carregar a página
        window.onload = function() {
            atualizarData();
        };
    </script>
</body>
</html>
